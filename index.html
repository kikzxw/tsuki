<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Tsuki — votre bibliothèque d'anime personnelle. Découvrez, classez et retrouvez vos séries préférées.">
    <meta name="theme-color" content="#100b12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <link rel="manifest" href="/manifest.json">
    <title>TSUKI — Anime Library</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- hls.js épinglé pour la lecture HLS (.m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
</head>
<body>
    <!-- Lien d'évitement clavier -->
    <a href="#main" class="skip-link">Aller au contenu principal</a>

    <!-- Navigation principale -->
    <header class="shell-header">
        <div class="header-inner">
            <a href="#/" class="logo" aria-label="Accueil Tsuki">
                <span class="logo-mark" aria-hidden="true">TSK</span>
                <span class="logo-text">TSUKI<span class="logo-sub">ANIME LIBRARY</span></span>
            </a>

            <form class="shell-search" role="search" aria-label="Recherche rapide">
                <span class="search-symbol" aria-hidden="true">⌕</span>
                <input type="search" id="shellSearchInput" placeholder="Un titre, une saison, une humeur…" autocomplete="off" results="0" spellcheck="false">
                <kbd>↵</kbd>
            </form>

            <div class="header-actions">
                <a href="#/historique" class="icon-btn" aria-label="Historique">◷</a>
                <a href="#/favoris" class="icon-btn fav-btn" aria-label="Favoris" aria-expanded="false">♡<span id="shellFavCount" class="visually-hidden">0 favoris</span></a>
                <button id="themeToggle" type="button" class="icon-btn" aria-label="Changer de thème">☼</button>
            </div>
        </div>
        <nav class="primary-nav" aria-label="Navigation principale">
            <a href="#/" data-nav="/">Découvrir</a>
            <a href="#/decouvrir" data-nav="/decouvrir">Catalogue</a>
            <a href="#/listes" data-nav="/listes">Mes listes</a>
            <a href="#/historique" data-nav="/historique">Récemment vus</a>
            <a href="#/favoris" data-nav="/favoris">Favoris <span class="nav-count" id="navFavCount">0</span></a>
        </nav>
    </header>

    <main id="main" tabindex="-1" class="shell-main">
        <!-- Router outlet : le contenu des pages est injecté ici -->
        <div id="router-outlet"></div>
    </main>

    <footer class="shell-footer">
        <div class="footer-inner">
            <p>Tsuki Library — <a href="#/a-propos">À propos</a> · <a href="#/confidentialite">Confidentialité</a> · <a href="#/conditions">Conditions</a> · <a href="#/parametres">Préférences</a></p>
            <p id="footerYear"></p>
        </div>
    </footer>

    <!-- Toast global -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Modal globale -->
    <div id="globalModal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content"></div>
    </div>

    <!-- Modules de l'application (ES modules) -->
    <script type="module">
        import { config } from './scripts/config.js';
        import { Storage } from './scripts/storage.js';
        import { Cache } from './scripts/cache.js';
        import { AniListAPI } from './scripts/api/anilist.js';
        import { FrembedAPI } from './scripts/api/frembed.js';
        import { AnimeDocAPI } from './scripts/api/animedoc.js';
        import { Router } from './scripts/router.js';
        import { UI } from './scripts/ui.js';
        import { HomePage } from './scripts/pages/home.js';
        import { DiscoverPage } from './scripts/pages/discover.js';
        import { SearchPage } from './scripts/pages/search.js';
        import { DetailPage } from './scripts/pages/detail.js';
        import { PlayerPage } from './scripts/pages/player.js';
        import { FavoritesPage } from './scripts/pages/favorites.js';
        import { SettingsPage } from './scripts/pages/settings.js';
        import { ListsPage } from './scripts/pages/lists.js';
        import { HistoryPage } from './scripts/pages/history.js';
        import { App } from './scripts/app.js';

        window.addEventListener('DOMContentLoaded', async () => {
            const storage = new Storage({ keys: config.storageKeys });
            const cache = new Cache(config.cacheTTL);
            const anilist = new AniListAPI({
                baseURL: config.anilist.baseURL,
                perPage: config.anilist.perPage,
                timeout: config.anilist.timeout,
                cache,
            });
            const frembed = new FrembedAPI({ cache });
            const animedoc = new AnimeDocAPI({
                baseURL: config.animedoc.baseURL,
                timeout: config.animedoc.timeout,
                cache,
            });

            const ui = new UI();
            const router = new Router({
                outlet: document.getElementById('router-outlet'),
                dependencies: { storage, cache, anilist, frembed, animedoc, ui, config },
            });

            // Enregistrer les pages
            router.register('/', HomePage);
            router.register('/home', HomePage);
            router.register('/decouvrir', DiscoverPage);
            router.register('/recherche', SearchPage);
            router.register('/anime/:id', DetailPage);
            router.register('/lecteur', PlayerPage);
            router.register('/favoris', FavoritesPage);
            router.register('/listes', ListsPage);
            router.register('/historique', HistoryPage);
            router.register('/parametres', SettingsPage);
            router.register('/a-propos', AboutPage);
            router.register('/confidentialite', PrivacyPage);
            router.register('/conditions', TermsPage);

            const app = new App({
                storage, cache, anilist, frembed, animedoc, ui, router, config,
                elements: {
                    searchInput: document.getElementById('shellSearchInput'),
                    searchForm: document.querySelector('.shell-search'),
                    themeToggle: document.getElementById('themeToggle'),
                    favBtn: document.querySelector('.fav-btn'),
                    favCount: document.getElementById('shellFavCount'),
                    userBtn: document.getElementById('userBtn'),
                    toast: document.getElementById('toast'),
                    modal: document.getElementById('globalModal'),
                    modalContent: document.querySelector('#globalModal .modal-content'),
                    modalBackdrop: document.querySelector('#globalModal .modal-backdrop'),
                    modalClose: null,
                }
            });

            await app.init();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch((error) => {
                console.warn('Service worker indisponible', error);
            });
        }
        });

        // Pages statiques simples
        class AboutPage {
            constructor({ ui }) { this.ui = ui; }
            render() { return this.ui.renderStatic('À propos', `
                <p><strong>Tsuki</strong> est une bibliothèque personnelle pour découvrir de nouvelles séries, garder ses coups de cœur et reprendre son visionnage.</p>
                <p>Les listes, favoris et l'historique sont conservés sur cet appareil. Aucune création de compte n'est nécessaire.</p>
            `); }
        }
        class PrivacyPage {
            constructor({ ui }) { this.ui = ui; }
            render() { return this.ui.renderStatic('Confidentialité', `
                <p>Aucune donnée personnelle n'est collectée. Tes favoris, listes, préférences et ton historique restent dans le stockage local de ton navigateur.</p>
                <p>Les fiches et affiches sont chargées depuis des services de catalogue externes.</p>
            `); }
        }
        class TermsPage {
            constructor({ ui }) { this.ui = ui; }
            render() { return this.ui.renderStatic('Conditions', `
                <p>Les informations de catalogue et la disponibilité de la lecture dépendent de services externes.</p>
            `); }
        }
    </script>
</body>
</html>

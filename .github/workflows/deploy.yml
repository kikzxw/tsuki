# ============================================================================
# Tsuki — Déploiement automatique sur Cloudflare Workers (tsuki.kikzxw.workers.dev)
# Déclenché à chaque push sur la branche main
# ============================================================================
name: Deploy Tsuki to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérifier la configuration de lecture
        run: test -n "$ANIMEDOC_API_KEY"
        env:
          ANIMEDOC_API_KEY: ${{ secrets.ANIMEDOC_API_KEY }}

      - name: Déployer sur Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify
          secrets: |
            ANIMEDOC_API_KEY
        env:
          ANIMEDOC_API_KEY: ${{ secrets.ANIMEDOC_API_KEY }}


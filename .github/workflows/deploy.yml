# ============================================================================
# Tsuki — Déploiement automatique sur Cloudflare Workers (tsuki.kikzxw.workers.dev)
# Déclenché à chaque push sur la branche main
# ============================================================================
name: Deploy Tsuki to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Wrangler (CLI Cloudflare)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Déployer sur Workers
        run: wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


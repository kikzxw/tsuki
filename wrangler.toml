# ============================================================================
# Tsuki — Configuration Cloudflare Workers
# Déploiement sur tsuki.kikzxw.workers.dev
# ============================================================================
name = "tsuki"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Assets statiques servis par le worker (dossier du projet)
[assets]
directory = "."

# Variables d'environnement
[vars]
SITE_NAME = "Sakura"
SITE_URL = "https://tsuki.kikzxw.workers.dev"

[secrets]
required = ["ANIMEDOC_API_KEY"]
